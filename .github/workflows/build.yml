name: Build neatGram APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache -s

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ hashFiles('TMessagesProj/jni/**') }}
          restore-keys: |
            ccache-arm64-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/neatgram.keystore

      - name: Build Release APK (arm64-v8a)
        env:
          CCACHE_DIR: /home/runner/.ccache
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -PtargetAbi=arm64-v8a -Pandroid.injected.invoked.from.ide=false -x lint -x lintVitalAfatRelease -x test --no-daemon --stacktrace

      - name: Show ccache stats
        if: always()
        run: |
          ccache -s || true

      - name: Remove decoded keystore
        if: always()
        run: rm -f TMessagesProj/config/neatgram.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neatGram-arm64-release
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          generate_release_notes: true
